<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#921515" />
    <title>SAS Connect</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Saved theme and text size are applied before first paint, so nothing flashes. Same keys as src/theme.js. -->
    <script>
      try {
        var theme = localStorage.getItem('sas.theme')
        var size = localStorage.getItem('sas.textSize')
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        if (size === 'large' || size === 'xlarge') document.documentElement.dataset.text = size
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
